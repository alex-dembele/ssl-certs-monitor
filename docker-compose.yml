# Fichier: docker-compose.yml
version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend-api:8000
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-}
    depends_on:
      backend-api:
        condition: service_healthy
    dns: [ "8.8.8.8", "1.1.1.1" ]
    restart: unless-stopped

  backend-api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_API_TOKEN=${BACKEND_API_TOKEN:-}
      - APP_ENV=${APP_ENV:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=postgresql+psycopg://monitor:${POSTGRES_PASSWORD:-monitor}@db:5432/ssl_monitor
    dns: [ "8.8.8.8", "1.1.1.1" ]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ssl_monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d ssl_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-cron:
    build: ./backend
    env_file: [ ".env" ]
    dns: [ "8.8.8.8", "1.1.1.1" ]
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg://monitor:${POSTGRES_PASSWORD:-monitor}@db:5432/ssl_monitor
      # Utilisé tant que l'intervalle n'est pas défini dans Paramètres > Organisation.
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-60}
    command: ["python", "scheduler.py"]

volumes:
  postgres_data:
